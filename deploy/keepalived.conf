# one of two nodes. on the other: state BACKUP, priority 100, same router ids.
# keepalived adds the vips to the interface while master; xdpshield forwards the traffic.
# vrrp instances can't mix address families, so v6 gets its own instance and the
# sync group moves both together.
global_defs {
    script_user root
    enable_script_security
}

vrrp_script xdpshield_alive {
    script "/usr/bin/curl -sf --max-time 1 http://127.0.0.1:9100/healthz"
    interval 2
    fall 2
    rise 2
}

vrrp_sync_group LB {
    group {
        LB4
        LB6
    }
}

vrrp_instance LB4 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    garp_master_delay 1
    # authentication is weak in vrrp, keep it on a private segment
    authentication {
        auth_type PASS
        auth_pass changeme
    }
    virtual_ipaddress {
        203.0.113.10/32
    }
    track_script {
        xdpshield_alive
    }
}

vrrp_instance LB6 {
    state MASTER
    interface eth0
    virtual_router_id 52
    priority 150
    advert_int 1
    garp_master_delay 1
    native_ipv6 # forces vrrp v3, which has no authentication
    virtual_ipaddress {
        2001:db8:100::10/128
    }
    track_script {
        xdpshield_alive
    }
}
