# one of two nodes. on the other: state BACKUP, priority 100, same router_id scheme.
# keepalived adds the vip to the interface while master; xdpshield forwards the traffic.
vrrp_script xdpshield_alive {
    script "/usr/bin/curl -sf --max-time 1 http://127.0.0.1:9100/healthz"
    interval 2
    fall 2
    rise 2
}

vrrp_instance LB {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    garp_master_delay 1
    # authentication is weak in vrrp, keep it on a private segment
    authentication {
        auth_type PASS
        auth_pass changeme
    }
    virtual_ipaddress {
        203.0.113.10/32
        2001:db8:100::10/128
    }
    track_script {
        xdpshield_alive
    }
}
